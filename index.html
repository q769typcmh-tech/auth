<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vasper</title>
  <style>
    :root {
      --bg: #0a0a0b;
      --panel: #111114;
      --card: #16161a;
      --line: #2a2a30;
      --text: #f2f2f3;
      --muted: #8b8b96;
      --red: #e11d2e;
      --red2: #ff2d3f;
      --red-dim: rgba(225, 29, 46, 0.14);
      --ok: #3dd68c;
      --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(600px 280px at 10% -5%, rgba(225,29,46,.18), transparent 60%),
        radial-gradient(500px 240px at 100% 0%, rgba(225,29,46,.08), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .wrap, .nav, .gate { position: relative; z-index: 1; }
    .banner {
      background: var(--red-dim);
      border-bottom: 1px solid #3a1218;
      color: #ff6b78;
      text-align: center;
      padding: 9px 12px;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .nav {
      border-bottom: 1px solid var(--line);
      background: rgba(10,10,11,.9);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 40;
    }
    .nav-in {
      max-width: 980px; margin: 0 auto;
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .logo {
      font-weight: 800;
      letter-spacing: .2em;
      font-size: .82rem;
      color: var(--text);
    }
    .logo span { color: var(--red2); }
    .tabs { display: flex; gap: 6px; }
    .tabs button {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .tabs button:hover { color: var(--text); border-color: var(--line); }
    .tabs button.active {
      color: #fff;
      background: var(--red);
      border-color: var(--red);
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 70px; }
    .view { display: none; }
    .view.active { display: block; }
    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 1.9rem);
      font-weight: 700;
      letter-spacing: -.02em;
    }
    .sub { margin: 8px 0 18px; color: var(--muted); font-size: .9rem; }
    .btn {
      border: 0;
      border-radius: 6px;
      padding: 10px 16px;
      font-family: inherit;
      font-weight: 700;
      font-size: .82rem;
      letter-spacing: .03em;
      cursor: pointer;
    }
    .btn-r { background: var(--red); color: #fff; }
    .btn-r:hover { background: var(--red2); }
    .btn-g {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .btn-g:hover { border-color: #444; }
    .btn-d {
      background: transparent;
      color: var(--red2);
      border: 1px solid #5a1820;
    }
    .btn-sm { padding: 7px 11px; font-size: .75rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px;
    }
    label {
      display: block;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      font-size: .9rem;
      margin-bottom: 12px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--red);
      box-shadow: 0 0 0 2px var(--red-dim);
    }
    textarea {
      font-family: var(--mono);
      font-size: 12px;
      min-height: 230px;
      line-height: 1.5;
      resize: vertical;
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    .msg { margin-top: 10px; font-size: .84rem; color: var(--muted); min-height: 18px; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--red2); }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; } }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card:hover { border-color: #3a3a44; }
    .card h3 { margin: 0; font-size: .98rem; }
    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: .65rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: var(--red-dim);
      color: var(--red2);
      border: 1px solid #5a1820;
    }
    .meta { font-size: .75rem; color: var(--muted); }
    .box {
      margin-top: 12px;
      background: #050506;
      border: 1px solid var(--line);
      border-left: 3px solid var(--red);
      border-radius: 6px;
      padding: 12px;
      font-family: var(--mono);
      font-size: 11.5px;
      color: #e8c4c8;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }
    .box.show { display: block; }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .88rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .check input { width: 15px; height: 15px; accent-color: var(--red); margin: 0; }
    .gate {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .gate-card {
      max-width: 400px;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 3px solid var(--red);
      border-radius: 10px;
      padding: 32px 24px;
      text-align: center;
    }
    .gate-card h1 { font-size: 1.4rem; margin: 0 0 10px; }
    .gate-card p { color: var(--muted); margin: 0 0 18px; line-height: 1.5; font-size: .9rem; }
    footer {
      margin-top: 36px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: .75rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="gate" class="gate" style="display:none">
    <div class="gate-card">
      <div class="logo" style="margin-bottom:16px">VASPER <span>LUA</span></div>
      <h1>Access denied</h1>
      <p>Source is locked. Run the official loader with a valid <code style="color:var(--red2)">script_key</code>.</p>
      <button type="button" class="btn btn-r" id="gateHome">Main site</button>
      <p class="meta" style="margin-top:16px" id="gateMeta"></p>
    </div>
  </div>

  <div id="app">
    <div class="banner">Protected loaders · script_key auth · source hidden on share</div>
    <nav class="nav">
      <div class="nav-in">
        <div class="logo">VASPER <span>LUA</span></div>
        <div class="tabs">
          <button type="button" class="active" data-v="library">Library</button>
          <button type="button" data-v="create">Create</button>
        </div>
      </div>
    </nav>

    <div class="wrap">
      <section class="view active" id="view-library">
        <h1>Library</h1>
        <p class="sub">Your scripts · free · loader uses script_key</p>
        <div class="row" style="margin-bottom:14px">
          <button type="button" class="btn btn-r" id="btnNew">New script</button>
        </div>
        <div class="grid" id="grid"></div>
      </section>

      <section class="view" id="view-create">
        <h1>Editor</h1>
        <p class="sub">Build a normal script_key loader</p>
        <div class="panel">
          <label>Name</label>
          <input type="text" id="name" placeholder="Script name" maxlength="64" />
          <label>Status</label>
          <select id="status">
            <option value="alive">Working</option>
            <option value="error">Error</option>
            <option value="offline">Offline</option>
          </select>
          <label class="check"><input type="checkbox" id="protect" checked /> Protect (script_key)</label>
          <label>script_key</label>
          <input type="text" id="key" placeholder="VS-XXXX-XXXX" maxlength="64" />
          <label>Source</label>
          <textarea id="code" placeholder="-- lua" spellcheck="false"></textarea>
          <div class="row">
            <button type="button" class="btn btn-r" id="save">Save</button>
            <button type="button" class="btn btn-g" id="copyLoader">Copy loader</button>
            <button type="button" class="btn btn-g" id="dl">Download</button>
            <button type="button" class="btn btn-g" id="share">Share link</button>
            <button type="button" class="btn btn-g" id="back">Library</button>
          </div>
          <div class="msg" id="msg">Ready</div>
          <div class="box" id="out"></div>
        </div>
      </section>

      <footer>
        <span>Vasper</span>
        <span>Black / Red</span>
      </footer>
    </div>
  </div>

  <script>
(function () {
  const STORE = "vasper_lua_hide_v1";
  let editingId = null;
  const params = new URLSearchParams(location.search);
  const shareId = params.get("s");
  if (shareId) {
    document.getElementById("app").style.display = "none";
    document.getElementById("gate").style.display = "flex";
    var list = [];
    try { list = JSON.parse(localStorage.getItem(STORE) || "[]"); } catch (e) {}
    var found = list.find(function (x) { return x.id === shareId; });
    document.getElementById("gateMeta").textContent = found
      ? ((found.name || "Script") + " · locked")
      : "locked";
    document.getElementById("gateHome").onclick = function () {
      location.href = location.pathname;
    };
    return;
  }

  const nameEl = document.getElementById("name");
  const codeEl = document.getElementById("code");
  const statusEl = document.getElementById("status");
  const protectEl = document.getElementById("protect");
  const keyEl = document.getElementById("key");
  const msg = document.getElementById("msg");
  const out = document.getElementById("out");
  const grid = document.getElementById("grid");

  function load() {
    try { return JSON.parse(localStorage.getItem(STORE) || "[]"); } catch (e) { return []; }
  }
  function saveAll(a) { localStorage.setItem(STORE, JSON.stringify(a)); }
  function uid() { return "s_" + Math.random().toString(36).slice(2, 10); }
  function setMsg(t, ok) {
    msg.textContent = t;
    msg.className = "msg" + (ok === true ? " ok" : ok === false ? " err" : "");
  }
  function show(v) {
    document.querySelectorAll(".view").forEach(function (el) { el.classList.remove("active"); });
    document.querySelectorAll(".tabs button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-v") === v);
    });
    document.getElementById("view-" + v).classList.add("active");
  }
  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.onclick = function () {
      show(b.getAttribute("data-v"));
      if (b.getAttribute("data-v") === "library") render();
    };
  });
  function shareUrl(id) {
    return location.origin + location.pathname + "?s=" + encodeURIComponent(id);
  }

  function buildLoader(code, key) {
    var k = String(key || "").replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    var body = String(code).replace(/\]\]/g, "]]..']]'..[[");
    if (!key) return code;
    return [
      "-- Vasper loader",
      "script_key = script_key or (getgenv and getgenv().script_key) or \"\"",
      "",
      "if script_key ~= \"" + k + "\" then",
      "    warn(\"[Vasper] Invalid key\")",
      "    return",
      "end",
      "",
      "local _src = [[" + body + "]]",
      "local fn, err = loadstring(_src)",
      "if not fn then",
      "    warn(\"[Vasper]\", err)",
      "    return",
      "end",
      "return fn()"
    ].join("\n");
  }

  function current() {
    return {
      id: editingId || uid(),
      name: nameEl.value.trim() || "Untitled",
      code: codeEl.value,
      status: statusEl.value || "alive",
      protect: protectEl.checked,
      key: (keyEl.value || "").trim(),
      updated: Date.now()
    };
  }
  function persist(d) {
    var arr = load();
    if (editingId) {
      var i = arr.findIndex(function (x) { return x.id === editingId; });
      if (i >= 0) arr[i] = d;
      else { editingId = d.id; arr.push(d); }
    } else {
      editingId = d.id;
      arr.push(d);
    }
    saveAll(arr);
    return d;
  }

  function render() {
    var arr = load();
    if (!arr.length) {
      grid.innerHTML = "<div class='panel' style='text-align:center;color:var(--muted)'>Empty.</div>";
      return;
    }
    grid.innerHTML = "";
    arr.slice().reverse().forEach(function (s) {
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        "<div style='display:flex;justify-content:space-between;gap:8px;align-items:center'>" +
          "<h3></h3><span class='pill'>Free</span></div>" +
        "<div class='meta'></div>" +
        "<div class='row'>" +
          "<button type='button' class='btn btn-g btn-sm' data-a='edit'>Edit</button>" +
          "<button type='button' class='btn btn-g btn-sm' data-a='loader'>Loader</button>" +
          "<button type='button' class='btn btn-g btn-sm' data-a='dl'>Download</button>" +
          "<button type='button' class='btn btn-d btn-sm' data-a='del'>Delete</button>" +
        "</div>";
      card.querySelector("h3").textContent = s.name || "Untitled";
      card.querySelector(".meta").textContent =
        (s.status === "error" ? "Error · " : s.status === "offline" ? "Offline · " : "Live · ") +
        (s.protect ? "keyed · " : "") +
        new Date(s.updated).toLocaleString();
      card.querySelectorAll("button").forEach(function (btn) {
        btn.onclick = function () {
          var a = btn.getAttribute("data-a");
          if (a === "edit") {
            editingId = s.id;
            nameEl.value = s.name || "";
            codeEl.value = s.code || "";
            statusEl.value = s.status || "alive";
            protectEl.checked = s.protect !== false;
            keyEl.value = s.key || "";
            out.classList.remove("show");
            show("create");
          } else if (a === "loader") {
            editingId = s.id;
            nameEl.value = s.name || "";
            codeEl.value = s.code || "";
            statusEl.value = s.status || "alive";
            protectEl.checked = s.protect !== false;
            keyEl.value = s.key || "";
            show("create");
            var loader = buildLoader(s.code, s.key);
            out.textContent =
              "script_key = \"" + (s.key || "KEY") + "\"\n\n" + loader;
            out.classList.add("show");
            setMsg("Loader ready", true);
          } else if (a === "dl") {
            if (!s.code.trim()) return;
            if (s.protect && !s.key) return alert("Set script_key");
            var body = s.protect ? buildLoader(s.code, s.key) : s.code;
            var ael = document.createElement("a");
            ael.href = URL.createObjectURL(new Blob([body], { type: "text/plain" }));
            ael.download = (s.name || "script").replace(/[^\w\-]+/g, "_") + "_loader.lua";
            ael.click();
          } else if (a === "del") {
            saveAll(load().filter(function (x) { return x.id !== s.id; }));
            render();
          }
        };
      });
      grid.appendChild(card);
    });
  }

  document.getElementById("btnNew").onclick = function () {
    editingId = null;
    nameEl.value = "";
    codeEl.value = "";
    statusEl.value = "alive";
    protectEl.checked = true;
    keyEl.value = "";
    out.classList.remove("show");
    show("create");
    setMsg("New");
  };
  document.getElementById("back").onclick = function () { render(); show("library"); };

  document.getElementById("save").onclick = function () {
    var d = current();
    if (!d.code.trim()) return setMsg("Need code.", false);
    if (d.protect && !d.key) return setMsg("Need script_key.", false);
    persist(d);
    setMsg("Saved.", true);
    render();
  };

  document.getElementById("copyLoader").onclick = async function () {
    var d = current();
    if (!d.code.trim()) return setMsg("Need code.", false);
    if (d.protect && !d.key) return setMsg("Need script_key.", false);
    persist(d);
    var text = "script_key = \"" + d.key.replace(/"/g, '\\"') + "\"\n\n" + buildLoader(d.code, d.key);
    out.textContent = text;
    out.classList.add("show");
    try {
      await navigator.clipboard.writeText(text);
      setMsg("Copied.", true);
    } catch (e) {
      setMsg("Copy from box.", true);
    }
  };

  document.getElementById("dl").onclick = function () {
    var d = current();
    if (!d.code.trim()) return setMsg("Need code.", false);
    if (d.protect && !d.key) return setMsg("Need script_key.", false);
    persist(d);
    var body = d.protect ? buildLoader(d.code, d.key) : d.code;
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([body], { type: "text/plain" }));
    a.download = (d.name || "script").replace(/[^\w\-]+/g, "_") + "_loader.lua";
    a.click();
    setMsg("Downloaded.", true);
  };

  document.getElementById("share").onclick = function () {
    var d = current();
    if (!d.code.trim()) return setMsg("Save first.", false);
    persist(d);
    var url = shareUrl(editingId);
    out.textContent = url;
    out.classList.add("show");
    navigator.clipboard.writeText(url).then(function () {
      setMsg("Share link copied (no source).", true);
    }).catch(function () {
      setMsg("Link ready.", true);
    });
  };

  render();
})();
  </script>
</body>
</html>
